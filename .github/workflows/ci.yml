name: Aethelgard Protocol CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Intelligent Contract Lint & Direct Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest genlayer-test genvm-lint

      - name: Lint Intelligent Contract
        run: |
          genvm-lint check contracts/AethelgardMarket.py

      - name: Execute Direct Unit & Regression Test Suite
        run: |
          pytest tests/direct/ -v
