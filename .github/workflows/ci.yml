name: Aethelgard Protocol CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Intelligent Contract Lint & Unit Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Lint Intelligent Contract Source
        run: |
          python -m py_compile contracts/AethelgardMarket.py

      - name: Validate Contract Schema & Methods
        run: |
          python scripts/export_schema.py
          python scripts/benchmark_contract.py

      - name: Execute Standalone Unit & Algorithm Test Suite
        run: |
          pytest tests/unit/ -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm ci

      - name: Execute Signed Write Actions Integration Tests
        run: npm test

